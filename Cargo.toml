[package]
name = "keyforge"
version = "0.1.0"
edition = "2024"
# let-chains, used in `load_filter`.
rust-version = "1.88"
description = "Scan Bitcoin vulnerabilities that produce guessable mnemonic phrases or private keys"
license = "MIT"
repository = "https://github.com/jamesbruddick/keyforge"

[lib]
name = "keyforge"
path = "src/lib.rs"

[[bin]]
name = "keyforge"
path = "src/main.rs"

[features]
default = []
# Host-side GPU scaffolding with no backend: enough to define `--gpu` and fail with a
# useful message. Never enabled alone in practice; `metal` and `cuda` pull it in.
gpu = []
metal = ["gpu", "dep:objc2", "dep:objc2-metal", "dep:objc2-foundation"]
# The CUDA backend.
#
#     cargo build --release --features cuda
#
# **One CUDA version, deliberately.** The pin below is what `cudarc` generates its driver
# bindings from, and only one can be active: cudarc gates its bindings per version, so two
# pins define every type twice. This tracks the latest major release and nothing else --
# supporting an older one means a second feature, a second set of filenames to search, and
# a build matrix where the interesting failures happen in the combination nobody built.
#
# The cost is stated plainly rather than hidden: **this needs a driver new enough for CUDA
# 13, which means 580 or later.** `nvidia-smi` prints the driver version. An older driver
# needs updating, not a different build.
#
# This does not decide which toolkit compiles the kernels. NVRTC is found and loaded at run
# time, and the one that can generate code for the card in the machine is the one that gets
# used -- see `gpu::cuda::nvrtc`. A card that needs an older compiler needs the older
# *install*, not a rebuild.
cuda = ["gpu", "dep:cudarc", "dep:libloading", "cudarc/cuda-13030"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
ctrlc = "3.5.2"
# Both hashers are used only through fixed-size digests, so neither default feature
# is reachable from here: `alloc` is for the boxed dyn-Digest forms and `oid` is the
# ASN.1 identifier table, which nothing in a hash160 asks for.
ripemd = { version = "0.2", default-features = false }
secp256k1 = "0.31.1"
# `block_api::compress512` is the whole reason this is a direct dependency: the
# PBKDF2 midstate trick and the two-lane SHA-512 both need the raw compression
# function. It picks its own SHA-NI / ARMv8 backend at runtime, so there is no
# assembly feature to enable and nothing to special-case per target.
sha2 = { version = "0.11", default-features = false }

# GPU backends, both optional and both off by default. Kernels are compiled from source
# at runtime rather than at build time -- see `gpu::source` -- so neither of these drags
# in a GPU toolchain, and a plain `cargo build` compiles none of it.
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
# `dynamic-loading` dlopens the CUDA libraries at run time instead of linking them, so this
# builds on a machine with no CUDA at all.
#
# **The version is pinned by the `cuda` feature above, and it must be set.** The pin does
# not only select API bindings -- it also decides which filenames cudarc searches for, and
# those are versioned. A CUDA 12 install ships `libnvrtc.so.12` and `nvrtc64_120_0.dll`,
# neither of which a build pinned to 13 ever asks for, so a perfectly good install is
# reported as missing. Pinning low for compatibility, which is the right instinct for
# driver symbols, is wrong here.
#
# Two things that look like they should work and do not, both tested:
#   * `CUDARC_CUDA_VERSION` does not override a pinned feature. It *adds* a second version
#     cfg alongside it, which is the duplicate-definition case above. It only works when no
#     version feature is set at all, which is why the pin lives in a feature rather than
#     here where it could not be turned off.
#   * `cuda-version-from-build-system` detects the toolkit correctly on a machine that has
#     one, and fails the build on a machine that does not -- which would stop `cargo check
#     --features cuda` from working anywhere the kernels are merely being type-checked.
# `nvidia-smi` prints the version to match; cudarc's build script lists every accepted
# value if the pin is one it does not know.
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "driver",
    "nvrtc",
    "dynamic-loading",
] }

# NVRTC is loaded and called directly rather than through `cudarc`, so that which CUDA
# version compiles the kernels is decided by what is installed and what the card needs,
# not by the feature this was built with -- see `gpu::cuda::nvrtc`. It also loads the
# driver library out of its install directory before `cudarc` goes looking for it by bare
# name. This is the version cudarc links anyway, so it costs no extra compilation.
libloading = { version = "0.9", optional = true }

# madvise and sysctlbyname; see `bloom::BloomFilter::advise_hugepages` and
# `main::physical_ram`.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"


[dev-dependencies]
# Test oracle only. The hot loop rolls its own BIP32 to stay allocation-free; these
# tests hold it to what the reference implementation produces.
bitcoin = "0.32"
hex = "0.4.3"
num-bigint = "0.5.1"
rand = "0.10.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
